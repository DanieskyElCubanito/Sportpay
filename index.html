<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sports Pay - Premium Mining</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- NUEVA PALETA DE COLORES PREMIUM --- */
        :root {
            --bg-deep: #0f172a;          /* Fondo Medianoche Profundo */
            --card-deep: #1e293b;        /* Fondo de Tarjeta Intenso */
            --text-light: #f1f5f9;       /* Texto casi blanco */
            --text-gray: #94a3b8;        /* Texto descriptivo gris */
            
            /* Degradado de Acción (Azul Eléctrico a Cian) */
            --gradient-action: linear-gradient(135deg, #0070f3, #00c6ff);
            --gradient-action-active: linear-gradient(135deg, #0056b3, #0099cc);
            
            --success: #10b981;          /* Verde Esmeralda Vibrante */
            --danger: #ef4444;           /* Rojo Suave */
            
            /* Sombra Neuromórfica Suave */
            --neu-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
        }

        /* --- BASE --- */
        body {
            margin: 0;
            font-family: 'Inter', sans-serif; /* Fuente FinTech por excelencia */
            background-color: var(--bg-deep);
            color: var(--text-light);
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        /* --- COMPONENTES DE INTERFAZ --- */
        
        /* Cabecera Ticker */
        .ticker-wrap {
            background: #000;
            color: #ccc;
            font-size: 0.65em;
            padding: 5px 0;
            border-bottom: 1px solid #1e293b;
        }

        /* Balance Box (La principal) */
        .premium-balance-box {
            background: var(--card-deep);
            margin: 15px;
            padding: 30px 20px;
            border-radius: 24px;
            box-shadow: var(--neu-shadow);
            position: relative;
            overflow: hidden;
        }
        /* Efecto de luz suave en la esquina */
        .premium-balance-box::after {
            content: '';
            position: absolute;
            top: -50px; right: -50px;
            width: 150px; height: 150px;
            background: radial-gradient(circle, rgba(0, 112, 243, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
        }

        .bal-title {
            color: var(--text-gray);
            font-size: 0.8em;
            font-weight: 600;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .bal-amount {
            font-size: 3.2em; /* Mucho más grande */
            font-weight: 800; /* Extra-negrita */
            margin: 20px 0;
            letter-spacing: -2px;
        }

        /* EL BOTÓN AHORA PARECE BOTÓN */
        .btn-withdraw-premium {
            width: 100%;
            background: var(--gradient-action);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1.1em;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 112, 243, 0.5);
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-withdraw-premium:active {
            transform: translateY(2px) scale(0.98);
            background: var(--gradient-action-active);
            box-shadow: 0 2px 7px rgba(0, 112, 243, 0.3);
        }

        /* Status Bar (Conectado) */
        .premium-status-bar {
            background: rgba(30, 41, 59, 0.5);
            margin: 0 15px;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.1);
            color: var(--text-gray);
            font-size: 0.8em;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .live-dot {
            height: 8px; width: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: pulse-live 1.5s infinite;
        }

        @keyframes pulse-live {
            0% { transform: scale(0.95); opacity: 0.8; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Active Power Box */
        .premium-power-box {
            background: var(--card-deep);
            margin: 15px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: var(--neu-shadow);
        }

        .power-title {
            color: var(--text-gray);
            font-size: 0.75em;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex; height: 25px;
            align-items: center; justify-content: space-between;
        }

        .power-amount {
            font-size: 3.5em; /* Gigante */
            font-weight: 800;
            margin: 10px 0;
            color: var(--text-light);
            display: flex; align-items: baseline; gap: 5px;
        }
        .power-unit {
            font-size: 0.35em;
            color: var(--text-gray);
            font-weight: 600;
        }

        .live-badge {
            background: #000; color: #10b981;
            font-size: 0.6em; font-weight: 800;
            padding: 3px 8px; border-radius: 5px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        /* Navegación Inferior Corregida */
        .nav-bar-premium {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: rgba(15, 23, 42, 0.95); /* Semi-transparente */
            backdrop-filter: blur(10px); /* Efecto cristal */
            display: flex;
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
            border-top: 1px solid #1e293b;
            z-index: 1000;
        }
        .nav-item {
            flex: 1; text-align: center;
            color: var(--text-gray);
            font-size: 0.7em; font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-item.active {
            color: #00c6ff !important;
        }
        .nav-item i {
            display: block; font-size: 1.6em;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="ticker-wrap">
        <div style="display:inline-block; animation: ticker-kf 25s linear infinite; white-space: nowrap;">
            <span style="margin-right:25px;">BTC/USDT <span class="text-success">$67,241.50</span></span>
            <span style="margin-right:25px;">BNB/USDT <span class="text-success">$592.30</span></span>
            <span style="margin-right:25px;">ETH/USDT <span class="text-danger">$3,450.12</span></span>
            <span style="margin-right:25px;">BTC/USDT <span class="text-success">$67,241.50</span></span>
        </div>
    </div>
    <style> @keyframes ticker-kf { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } } </style>

    <div id="views-container">

        <div id="view-home" class="view active" style="display:block;">
            
                <div style="padding: 15px; display: flex; justify-content: space-between; align-items: center;">
                <div style="background: rgba(30,41,59,0.5); padding: 6px 14px; border-radius: 20px; font-size: 0.75em; font-weight: 600; color: #00c6ff; border: 1px solid rgba(0, 198, 255, 0.2);">
                    Sports Pay - ID:<span id="user-id">000000</span>
                </div>
                <i class="fas fa-user-circle" style="font-size: 1.5em; color: var(--text-gray);"></i>
            </div>

            <div class="premium-balance-box">
                <div class="bal-title">
                    <span>TOTAL EARNED USDT</span>
                    <span onclick="switchTab('history')" style="cursor:pointer; color: #00c6ff; font-weight: 700;"><i class="far fa-clock"></i> History</span>
                </div>
                <div class="bal-amount">$<span id="main-bal">0.0000</span></div>
                <button class="btn-withdraw-premium" onclick="switchTab('withdraw')">
                    <i class="fas fa-wallet"></i> Withdraw Funds
                </button>
            </div>

            <div class="premium-status-bar">
                <div class="live-dot"></div>
                <span>Node connected securely...</span>
            </div>

            <div class="premium-power-box">
                <div class="power-title">
                    <span><i class="fas fa-microchip" style="margin-right:5px;color:#00c6ff;"></i> ACTIVE MINING POWER</span>
                    <span class="live-badge">LIVE</span>
                </div>
                <div class="power-amount">
                    <span id="main-power">0</span> <span class="power-unit">GH/s</span>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; text-align: center; border-top: 1px solid #334155; padding-top: 15px;">
                    <div><div style="font-size: 0.6em; color: var(--text-gray); font-weight: 700; text-transform:uppercase;">DAILY</div><div style="font-weight: 800; color: var(--success); font-size: 1.1em;">$<span id="stat-daily">0.00</span></div></div>
                    <div><div style="font-size: 0.6em; color: var(--text-gray); font-weight: 700; text-transform:uppercase;">RATE</div><div style="font-weight: 800; color: #00c6ff; font-size: 1.1em;"><span id="stat-rate">5.5</span>%</div></div>
                    <div><div style="font-size: 0.6em; color: var(--text-gray); font-weight: 700; text-transform:uppercase;">SETTLE</div><div style="font-weight: 800; color: var(--text-light); font-size: 1.1em;" id="timer">00:00:00</div></div>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 15px;">
                <button class="btn-withdraw-premium" onclick="switchTab('buy')" style="height: 100px; flex-direction: column;">
                    <i class="fas fa-chart-line" style="font-size: 1.8em; margin-bottom: 8px;"></i>
                    Purchase Hash
                </button>
                <button class="btn-withdraw-premium" onclick="switchTab('referrals')" style="height: 100px; flex-direction: column; background: var(--card-deep); color: #00c6ff; box-shadow: 0 4px 14px rgba(0,0,0,0.3);">
                    <i class="fas fa-users" style="font-size: 1.8em; margin-bottom: 8px;"></i>
                    My Network
                </button>
            </div>
        </div>
        
    </div> <nav class="nav-bar-premium">
        <div class="nav-item active" onclick="switchTab('home')">
            <i class="fas fa-home"></i>
            Home
        </div>
        <div class="nav-item" onclick="switchTab('buy')">
            <i class="fas fa-microchip"></i>
            Invest
        </div>
        <div class="nav-item" onclick="switchTab('referrals')">
            <i class="fas fa-network-wired"></i>
            Network
        </div>
        <div class="nav-item" onclick="switchTab('history')">
            <i class="fas fa-receipt"></i>
            History
        </div>
    </nav>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.view').forEach(v => {
                v.style.display = 'none';
                v.classList.remove('active');
            });
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            
            const target = document.getElementById('view-' + tabId);
            if(target) {
                target.style.display = 'block';
                setTimeout(() => target.classList.add('active'), 10);
            }
            
            // Actualizar Nav activo
            const navItems = document.querySelectorAll('.nav-item');
            if(tabId === 'home') navItems[0].classList.add('active');
            if(tabId === 'buy') navItems[1].classList.add('active');
            if(tabId === 'referrals') navItems[2].classList.add('active');
            if(tabId === 'history') navItems[ navItems.length - 1 ].classList.add('active');
            
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
        }
        window.switchTab = switchTab;
    </script>
</body>
</html>
