<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sports Pay</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* #1____________________________ ESTILOS BASE (AE TECH STYLE) */
        :root {
            --bg-gray: #f2f2f2;
            --text-main: #333333;
            --text-muted: #999999;
            --ae-blue: #007aff;
            --white: #ffffff;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0; padding: 0;
        }

        /* #2____________________________ SISTEMA DE VISTAS */
        .view { display: none; min-height: 100vh; animation: fadeIn 0.1s ease; }
        .view.active { display: block !important; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* #3____________________________ COMPONENTES AE TECH */
        .header-ae {
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px 15px; background: var(--white);
            font-size: 1.1em; font-weight: 500;
        }

        .section-block {
            background: var(--white);
            padding: 15px 20px;
            margin-top: 10px;
        }

        .label-muted {
            color: var(--text-muted);
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .balance-big {
            font-size: 1.8em;
            font-weight: bold;
        }

        .input-ae {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 1px solid #eeeeee;
            font-size: 1em;
            outline: none;
            background: transparent;
            margin-bottom: 20px;
        }

        .btn-ae {
            width: 100%;
            background: var(--ae-blue);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 25px; /* Más redondeado como AE Tech */
            font-size: 1.1em;
            font-weight: 500;
        }

        /* Estilo de la tabla de Tiers */
        .tier-list { margin-top: 10px; background: white; }
        .tier-item {
            display: flex; align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #f9f9f9;
        }
        .tier-num {
            width: 32px; height: 32px; background: #f5f5f5;
            border-radius: 6px; display: flex; align-items: center;
            justify-content: center; font-weight: bold; margin-right: 15px;
        }
        .tier-data { flex: 1; }
        .tier-subtext { color: var(--text-muted); font-size: 0.75em; margin-bottom: 2px; }
        .tier-maintext { font-weight: bold; font-size: 1em; }
        
        .nav-bottom {
            position: fixed; bottom: 0; width: 100%; background: white;
            display: flex; padding: 10px 0 25px; border-top: 1px solid #eee;
        }
        .nav-item { flex: 1; text-align: center; color: #999; font-size: 0.7em; }
        .nav-item.active { color: var(--ae-blue); }
        .nav-item i { display: block; font-size: 1.6em; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div id="view-home" class="view active">
        <div class="header-ae" style="justify-content: center;">Sports Pay Mining</div>
        
        <div class="section-block">
            <div class="label-muted">Available Balance</div>
            <div class="balance-big">$ <span id="home-bal">0.0000</span></div>
        </div>

        <div class="section-block" style="text-align: center; background: linear-gradient(to right, #007aff, #00c6ff); color: white; border-radius: 15px; margin: 15px;">
            <div style="font-size: 0.8em; opacity: 0.8;">MINING POWER</div>
            <div style="font-size: 2em; font-weight: bold; margin: 10px 0;"><span id="home-power">0</span> GH/s</div>
            <button onclick="switchTab('buy')" style="background: white; color: #007aff; border: none; padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 0.8em;">UPGRADE</button>
        </div>
    </div>

    <div id="view-buy" class="view">
        <div class="header-ae">
            <i class="fas fa-chevron-left" onclick="switchTab('home')"></i>
            <span>Buy GH/s</span>
            <i class="fas fa-history"></i>
        </div>

        <div class="section-block">
            <div class="label-muted">My total valid GH/s:</div>
            <div class="balance-big"><span id="buy-power-display">0</span> <span style="font-size: 0.6em; color: var(--text-muted);">GH/s</span></div>
        </div>

        <div class="section-block">
            <input type="number" class="input-ae" id="buy-amount" placeholder="Please enter the amount of GH/s to buy">
            <button class="btn-ae" onclick="processPurchase()">Buy Now</button>
        </div>

        <div class="tier-list">
            <div class="tier-item">
                <div class="tier-num">1</div>
                <div class="tier-data">
                    <div class="tier-subtext">Amount</div>
                    <div class="tier-maintext">>= $0</div>
                </div>
                <div style="text-align: right;">
                    <div class="tier-subtext">Return</div>
                    <div class="tier-maintext" style="color: var(--ae-blue);">5.5%</div>
                </div>
            </div>
            <div class="tier-item">
                <div class="tier-num">2</div>
                <div class="tier-data">
                    <div class="tier-subtext">Amount</div>
                    <div class="tier-maintext">>= $20</div>
                </div>
                <div style="text-align: right;">
                    <div class="tier-subtext">Return</div>
                    <div class="tier-maintext" style="color: var(--ae-blue);">6.0%</div>
                </div>
            </div>
            <div class="tier-item">
                <div class="tier-num">3</div>
                <div class="tier-data">
                    <div class="tier-subtext">Amount</div>
                    <div class="tier-maintext">>= $300</div>
                </div>
                <div style="text-align: right;">
                    <div class="tier-subtext">Return</div>
                    <div class="tier-maintext" style="color: var(--ae-blue);">6.5%</div>
                </div>
            </div>
            <div class="tier-item" style="position: relative;">
                <div style="position: absolute; right: 20px; top: 0; background: #ffebeb; color: #ff3b30; font-size: 0.6em; padding: 2px 8px; border-radius: 10px; font-weight: bold;">POPULAR</div>
                <div class="tier-num">4</div>
                <div class="tier-data">
                    <div class="tier-subtext">Amount</div>
                    <div class="tier-maintext">>= $3000+</div>
                </div>
                <div style="text-align: right;">
                    <div class="tier-subtext">Return</div>
                    <div class="tier-maintext" style="color: #ff3b30;">Contact</div>
                </div>
            </div>
        </div>
    </div>

    <div id="view-share" class="view">
        <div class="header-ae" style="justify-content: center;">Referral</div>
        <div class="section-block" style="text-align: center; margin-top: 50px;">
            <i class="fas fa-link" style="font-size: 3em; color: var(--ae-blue); margin-bottom: 20px;"></i>
            <div id="ref-link" style="word-break: break-all; color: var(--ae-blue); font-weight: 500; margin-bottom: 20px;"></div>
            <button class="btn-ae" onclick="copyRef()">Copy Referral Link</button>
        </div>
    </div>

    <div id="view-about" class="view">
        <div class="header-ae" style="justify-content: center;">About</div>
        <div class="section-block" onclick="tg.showAlert('Support: @Danny_Support')">
            <div style="display: flex; justify-content: space-between;">
                <span>Online Support</span>
                <i class="fas fa-chevron-right" style="color: #ccc;"></i>
            </div>
        </div>
    </div>

    <nav class="nav-bottom" id="ae-nav">
        <div class="nav-item active" onclick="switchTab('home')"><i class="fas fa-home"></i>Home</div>
        <div class="nav-item" onclick="switchTab('share')"><i class="fas fa-share-alt"></i>Share</div>
        <div class="nav-item" onclick="switchTab('about')"><i class="fas fa-info-circle"></i>About</div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        function init() {
            const user = tg.initDataUnsafe?.user;
            if (user) {
                document.getElementById('ref-link').innerText = "https://t.me/SportsPay_bot?start=" + user.id;
            }
            // Aseguramos que empiece en 0
            updateData(0, 0);
        }

        function updateData(bal, power) {
            document.getElementById('home-bal').innerText = bal.toFixed(4);
            document.getElementById('home-power').innerText = power;
            document.getElementById('buy-power-display').innerText = power;
        }

        function switchTab(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
            
            const nav = document.getElementById('ae-nav');
            if(id === 'buy') {
                nav.style.display = 'none';
            } else {
                nav.style.display = 'flex';
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                const items = document.querySelectorAll('.nav-item');
                if(id === 'home') items[0].classList.add('active');
                if(id === 'share') items[1].classList.add('active');
                if(id === 'about') items[2].classList.add('active');
            }
            tg.HapticFeedback.impactOccurred('light');
        }

        function processPurchase() {
            const val = document.getElementById('buy-amount').value;
            if(val > 0) tg.sendData("buy_" + val);
            else tg.showAlert("Please enter a valid amount");
        }

        function copyRef() {
            const link = document.getElementById('ref-link').innerText;
            navigator.clipboard.writeText(link).then(() => tg.showAlert("Link Copied!"));
        }

        init();
    </script>
</body>
                    </html>
