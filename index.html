<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sports Pay - AE Tech Clone</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* #1____________________________ ESTILOS BASE (AE TECH ORIGINAL) */
        :root {
            --ae-blue: #007aff;
            --bg-gray: #f2f2f7;
            --text-dark: #000000;
            --text-gray: #8e8e93;
            --white: #ffffff;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0;
        }

        /* #2____________________________ SISTEMA DE VISTAS */
        .view { display: none; min-height: 100vh; animation: fadeIn 0.1s ease; }
        .view.active { display: block !important; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* #3____________________________ COMPONENTES DASHBOARD */
        .section-ae { background: var(--white); padding: 15px 20px; margin-top: 10px; }
        
        .energy-card-ae {
            background: linear-gradient(135deg, #007aff, #00c6ff);
            color: white; margin: 10px; padding: 20px; border-radius: 15px;
        }

        .tier-row { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 15px 0; border-bottom: 1px solid #f2f2f7; 
        }
        .tier-icon { 
            width: 35px; height: 35px; background: #f2f2f7; border-radius: 8px; 
            display: flex; align-items: center; justify-content: center; font-weight: bold; 
        }

        /* #4____________________________ COMPONENTES DE COMPRA (ESTILO VIDEO) */
        .input-group-ae {
            display: flex; align-items: center; border-bottom: 1px solid #eee;
            padding: 10px 0; margin: 10px 0;
        }
        .input-group-ae input {
            border: none; outline: none; font-size: 1.1em; width: 100%; font-weight: 500;
        }

        .grid-est {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px;
        }
        .box-est {
            border: 1px solid #efeff4; padding: 10px; border-radius: 8px; text-align: center;
        }
        .label-est { color: var(--ae-blue); font-size: 0.65em; font-weight: bold; margin-bottom: 4px; }
        .val-est { font-size: 0.85em; font-weight: 700; }

        .btn-ae-main {
            width: 100%; background: var(--ae-blue); color: white; border: none;
            padding: 15px; border-radius: 25px; font-weight: 600; font-size: 1em;
        }

        /* #5____________________________ NAVEGACIÓN INFERIOR */
        .nav-ae {
            position: fixed; bottom: 0; width: 100%; background: white;
            display: flex; padding: 10px 0 25px; border-top: 1px solid #eee;
        }
        .nav-tab { flex: 1; text-align: center; color: #999; font-size: 0.7em; }
        .nav-tab.active { color: var(--ae-blue); }
        .nav-tab i { display: block; font-size: 1.6em; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div id="view-home" class="view active">
        <div style="background: white; padding: 15px; font-weight: 600; border-bottom: 1px solid #eee; text-align: center;">Sports Pay</div>
        
        <div class="section-ae">
            <div style="color: var(--text-gray); font-size: 0.85em;">Available Balance</div>
            <div style="font-size: 2em; font-weight: 700;">$ <span id="home-bal">0.0000</span></div>
        </div>

        <div class="energy-card-ae">
            <div style="font-size: 0.7em; opacity: 0.9;">AI ENERGY POWER</div>
            <div style="font-size: 2.5em; font-weight: 800; margin: 10px 0;"><span id="home-power">0</span></div>
            <div style="display: flex; justify-content: space-between; font-size: 0.75em;">
                <span>Daily: $<span id="home-daily">0.00</span></span>
                <span>Return: <span id="home-rate">5.5</span>%</span>
            </div>
        </div>
    </div>

    <div id="view-buy" class="view">
        <div style="background: white; padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #eee;">
            <i class="fas fa-chevron-left" onclick="switchTab('home')" style="margin-right: 15px;"></i>
            <span style="font-weight: 700;">Buy AI Energy</span>
        </div>

        <div class="section-ae">
            <div style="color: var(--text-gray); font-size: 0.8em; margin-bottom: 10px;">ENTER QUANTITY</div>
            <div class="input-group-ae">
                <img src="https://cryptologos.cc/logos/tether-usdt-logo.png" width="24" style="margin-right: 10px;">
                <input type="number" id="buy-amount" placeholder="0.00" oninput="logic_calculate()">
            </div>
            <div style="text-align: center; margin-top: 15px;">
                <span style="color: var(--text-gray); font-size: 0.85em;">New total: </span>
                <span id="calc-new-ae" style="color: var(--ae-blue); font-weight: 800;">0</span>
                <span style="color: var(--ae-blue); font-weight: 800;"> AE</span>
            </div>
        </div>

        <div class="grid-est" style="padding: 0 15px;">
            <div class="box-est"><div class="label-est">DAILY</div><div class="val-est" id="est-daily">$0.00</div></div>
            <div class="box-est"><div class="label-est">20 DAYS</div><div class="val-est" id="est-20">$0.00</div></div>
            <div class="box-est"><div class="label-est">PROFIT</div><div class="val-est" id="est-profit" style="color: #34c759;">$0.00</div></div>
        </div>

        <div style="padding: 20px;">
            <button class="btn-ae-main" onclick="logic_process_pay()">Continue</button>
        </div>
    </div>

    <nav class="nav-ae" id="main-nav">
        <div class="nav-tab active" onclick="switchTab('home')"><i class="fas fa-home"></i>Home</div>
        <div class="nav-tab" onclick="switchTab('buy')"><i class="fas fa-bolt"></i>Energy</div>
        <div class="nav-tab" onclick="switchTab('about')"><i class="fas fa-user"></i>Me</div>
    </nav>

    <script>
        /* #9____________________________ INICIO DE TELEGRAM */
        const tg = window.Telegram.WebApp;
        tg.ready();

        /* #10___________________________ FUNCIÓN: CAMBIO DE PESTAÑA */
        function switchTab(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
            
            const nav = document.getElementById('main-nav');
            if(id === 'buy') nav.style.display = 'none';
            else nav.style.display = 'flex';
            
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            tg.HapticFeedback.impactOccurred('light');
        }

        /* #11___________________________ FUNCIÓN: LÓGICA DE CÁLCULO (VIDEO) */
        function logic_calculate() {
            const input = document.getElementById('buy-amount').value || 0;
            const amount = parseFloat(input);
            
            // Lógica AE: 1 USDT = 1000 AE
            const extraAE = amount * 1000;
            const currentAE = 6530; // Ejemplo del video
            const totalAE = currentAE + extraAE;
            
            // Tasa dinámica
            let rate = 5.5;
            if(amount >= 20) rate = 6.0;
            if(amount >= 300) rate = 6.5;

            const daily = (totalAE / 1000) * (rate / 100);

            document.getElementById('calc-new-ae').innerText = totalAE.toLocaleString();
            document.getElementById('est-daily').innerText = "$" + daily.toFixed(4);
            document.getElementById('est-20').innerText = "$" + (daily * 20).toFixed(3);
            document.getElementById('est-profit').innerText = "$" + (daily * 1.5).toFixed(3);
        }

        /* #12___________________________ FUNCIÓN: PROCESAR PAGO */
        function logic_process_pay() {
            const val = document.getElementById('buy-amount').value;
            if(val > 0) {
                tg.HapticFeedback.notificationOccurred('success');
                tg.sendData("pay_" + val);
            } else {
                tg.showAlert("Please enter an amount");
            }
        }
    </script>
</body>
    </html>
