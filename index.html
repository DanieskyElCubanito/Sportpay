<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sports Pay</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-light: #f4f7fa;
            --card-white: #ffffff;
            --text-dark: #1e293b;
            --text-dim: #64748b;
            --primary-blue: #2563eb;
            --accent-orange: #f97316;
            --border-light: #e2e8f0;
            --shadow-sm: 0 2px 6px rgba(0,0,0,0.05);
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0; overflow-x: hidden;
        }

        .view { display: none; padding-bottom: 100px; animation: fadeIn 0.3s ease; }
        .view.active { display: block !important; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* HEADER */
        .home-header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: var(--card-white);
            border-bottom: 1px solid var(--border-light);
        }
        .header-logo {
            width: 50px; height: 50px;
            background-color: #eef2ff;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary-blue); font-weight: bold; font-size: 1.2em;
            border: 1px solid var(--border-light);
        }
        .header-info h2 { margin: 0; font-size: 1.1em; font-weight: 700; }
        .header-info p { margin: 2px 0 0; font-size: 0.8em; color: var(--text-dim); }

        /* BALANCE */
        .balance-section {
            padding: 15px 20px;
            background-color: var(--card-white);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-light);
        }
        .balance-row { display: flex; justify-content: space-between; align-items: center; }
        .bal-label-group { display: flex; align-items: center; gap: 8px; font-size: 0.85em; color: var(--text-dim); }
        .bal-value { font-size: 1.8em; font-weight: 800; margin: 5px 0; }
        
        .btn-withdraw {
            background-color: var(--primary-blue);
            color: white; border: none; padding: 10px 20px;
            border-radius: 10px; font-weight: bold; font-size: 0.9em;
        }

        /* ENERGY CARD GH/s */
        .energy-card-container { padding: 0 15px; margin-bottom: 15px; }
        .energy-card {
            background-color: var(--primary-blue);
            color: white; padding: 20px; border-radius: 20px;
            position: relative; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
            overflow: hidden;
        }
        .energy-card::after {
            content: "SP"; position: absolute; right: -20px; bottom: -30px;
            font-size: 10em; font-weight: 900; color: rgba(255,255,255,0.07);
        }
        
        .e-header { display: flex; align-items: center; justify-content: space-between; font-size: 0.85em; font-weight: bold; margin-bottom: 15px;}
        .e-title { display: flex; align-items: center; gap: 8px; }
        .e-value { text-align: center; font-size: 3em; font-weight: 800; margin: 10px 0;}
        .e-unit { font-size: 0.4em; margin-left: 5px; opacity: 0.8; }
        
        .e-stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; text-align: center; margin-top: 15px; position: relative; z-index: 1;}
        .e-stat-box { background-color: rgba(255,255,255,0.1); padding: 10px 5px; border-radius: 12px;}
        .es-label { font-size: 0.65em; color: rgba(255,255,255,0.8); text-transform: uppercase; display: block;}
        .es-val { font-size: 0.9em; font-weight: bold;}

        /* RECORDS */
        .record-item {
            background-color: var(--card-white); padding: 15px;
            border-radius: 12px; display: flex; align-items: center; gap: 12px;
            margin-bottom: 8px; border: 1px solid var(--border-light);
        }
        .r-date-badge {
            width: 40px; height: 40px; background-color: #f8fafc;
            border-radius: 8px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; border: 1px solid var(--border-light);
        }
        .r-date-day { font-size: 1.1em; font-weight: bold; color: var(--primary-blue); }
        .r-date-unit { font-size: 0.6em; color: var(--text-dim); text-transform: uppercase; }
        .r-info { flex: 1; }
        .r-progress-bar { height: 6px; background-color: var(--bg-light); border-radius: 3px; margin-top: 5px; overflow: hidden;}
        .r-progress-fill { height: 100%; background-color: var(--primary-blue); width: 60%; }
        .rv-amount { color: var(--primary-blue); font-weight: bold; text-align: right;}
        .rv-unit { font-size: 0.7em; color: var(--accent-orange); text-align: right;}

        /* NAV */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; background: var(--card-white); 
            display: flex; padding: 12px 0 25px; border-top: 1px solid var(--border-light); 
        }
        .nav-tab { flex: 1; text-align: center; color: var(--text-dim); font-size: 0.75em; }
        .nav-tab.active { color: var(--primary-blue); }
        .nav-tab i { display: block; font-size: 1.5em; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div id="view-home" class="view active">
        <div class="home-header">
            <div class="header-logo">SP</div>
            <div class="header-info">
                <p>Welcome to Sports Pay,</p>
                <h2>User ID: <span id="display-id">Loading...</span></h2>
            </div>
        </div>

        <div class="balance-section">
            <div class="balance-row">
                <div>
                    <div class="bal-label-group"><span>Total Earned</span><i class="fas fa-history"></i></div>
                    <div class="bal-value">$ <span id="total-val">0.0000</span></div>
                </div>
                <button class="btn-withdraw" onclick="tg.sendData('withdraw')">Withdraw</button>
            </div>
        </div>

        <div class="energy-card-container">
            <div class="energy-card">
                <div class="e-header">
                    <div class="e-title"><i class="fas fa-bolt" style="color:var(--accent-orange)"></i> AI MINING POWER</div>
                    <i class="fas fa-sync-alt" onclick="location.reload()"></i>
                </div>
                <div class="e-value">6530<span class="e-unit">GH/s</span></div>
                <div class="e-stats-grid">
                    <div class="e-stat-box"><span class="es-label">Daily profit</span><span class="es-val">$ 0.3592</span></div>
                    <div class="e-stat-box"><span class="es-label">Power</span><span class="es-val">Active</span></div>
                    <div class="e-stat-box"><span class="es-label">Settlement</span><span class="es-val">10:32:03</span></div>
                </div>
            </div>
        </div>

        <div style="padding: 0 15px;">
            <div style="font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-microchip" style="color:var(--primary-blue)"></i> Mining Records
            </div>
            <div class="record-item">
                <div class="r-date-badge"><span class="r-date-day">1</span><span class="r-date-unit">Day</span></div>
                <div class="r-info">
                    <span style="font-size: 0.7em; color: var(--text-dim);">2026-03-24</span>
                    <div class="r-progress-bar"><div class="r-progress-fill"></div></div>
                </div>
                <div>
                    <div class="rv-amount">+1233.8</div>
                    <div class="rv-unit">GH/s</div>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-tab active"><i class="fas fa-home"></i>Home</div>
        <div class="nav-tab" onclick="tg.showAlert('Coming soon')"><i class="fas fa-share-alt"></i>Share</div>
        <div class="nav-tab" onclick="tg.showAlert('Coming soon')"><i class="fas fa-user"></i>Account</div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); // Muy importante para que el ID cargue rápido
        tg.expand();

        function loadUserData() {
            const user = tg.initDataUnsafe?.user;
            const idElement = document.getElementById('display-id');
            
            if (user && user.id) {
                idElement.innerText = user.id;
            } else {
                // Fallback si no detecta el ID (por ejemplo en PC sin sesión)
                idElement.innerText = "Guest User";
            }
        }

        // Ejecutar carga de datos
        loadUserData();
    </script>
</body>
    </html>
