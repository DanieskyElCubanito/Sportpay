<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sports Pay - Premium</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #05070a;
            --card-glass: rgba(23, 28, 41, 0.8);
            --accent-blue: #0088cc;
            --accent-gradient: linear-gradient(135deg, #0088cc 0%, #00c6ff 100%);
            --text-main: #ffffff;
            --text-dim: #848da0;
            --glass-border: rgba(255, 255, 255, 0.08);
            --success: #10b981;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        .app-shell {
            padding: 20px;
            padding-bottom: 110px;
        }

        .header-profile {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-photo {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: var(--accent-gradient);
            border: 2px solid var(--glass-border);
            object-fit: cover;
        }

        .user-details h2 { margin: 0; font-size: 1.1rem; font-weight: 800; }
        .user-details span { font-size: 0.8rem; color: var(--accent-blue); font-weight: 600; }

        .btn-history-top {
            width: 44px; height: 44px; border-radius: 14px;
            background: var(--card-glass); border: 1px solid var(--glass-border);
            color: white; display: flex; align-items: center; justify-content: center;
        }

        .view { display: none; }
        .view.active { display: block !important; }

        .main-card {
            background: var(--card-glass); backdrop-filter: blur(15px);
            border-radius: 28px; padding: 25px; border: 1px solid var(--glass-border);
            margin-bottom: 20px; position: relative;
        }

        .balance-label { color: var(--text-dim); text-transform: uppercase; font-size: 0.75rem; font-weight: 700; }
        .balance-val { font-size: 3rem; font-weight: 800; margin: 10px 0; display: flex; align-items: baseline; }

        .nav-bar {
            position: fixed; bottom: 20px; left: 20px; right: 20px; height: 72px;
            background: rgba(13, 17, 28, 0.95); backdrop-filter: blur(20px);
            border-radius: 22px; display: flex; align-items: center; justify-content: space-around;
            padding: 0 10px; border: 1px solid var(--glass-border); z-index: 9999;
        }

        .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-dim); cursor: pointer; }
        .nav-btn.active { color: var(--accent-blue); }
        .nav-btn i { font-size: 1.4rem; }
        .nav-btn span { font-size: 0.65rem; font-weight: 700; }

        .btn-action { padding: 14px; border-radius: 18px; border: none; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
        .btn-blue { background: var(--accent-gradient); color: white; }
        .btn-dark { background: #1c2333; color: white; border: 1px solid var(--glass-border); }

        @keyframes slideUp { from { bottom: 0; opacity: 0; } to { bottom: 100px; opacity: 1; } }
    </style>
</head>
<body>

<div class="app-shell">
    <div class="header-profile">
        <div class="user-info">
            <img id="user-pic" class="user-photo" src="https://via.placeholder.com/100" alt="Profile">
            <div class="user-details">
                <h2 id="user-full-name">Cargando...</h2>
                <span id="user-id">ID: 000000</span>
            </div>
        </div>
        <div class="btn-history-top" onclick="switchTab('history')">
            <i class="fa-solid fa-clock-rotate-left"></i>
        </div>
    </div>

    <section id="dashboard" class="view active">
        <div class="main-card" style="background: linear-gradient(180deg, rgba(0,136,204,0.15) 0%, var(--card-glass) 100%);">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div class="balance-label">Balance Disponible</div>
                <div style="display: flex; align-items: center; gap: 5px; background: rgba(16, 185, 129, 0.1); padding: 4px 10px; border-radius: 20px;">
                    <span style="width: 8px; height: 8px; background: #10b981; border-radius: 50%;"></span>
                    <span style="font-size: 0.65rem; font-weight: 800; color: #10b981;">ACTIVO</span>
                </div>
            </div>
            <div class="balance-val">$<span id="main-balance">0.00</span></div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 20px;">
                <button class="btn-action btn-blue" onclick="switchTab('planes')" style="flex-direction: column; font-size: 0.75rem; height: 65px;">
                    <i class="fa-solid fa-plus"></i> Invertir
                </button>
                <div style="position: relative;">
                    <span style="position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; font-size: 0.6rem; padding: 2px 6px; border-radius: 6px;">+5%</span>
                    <button class="btn-action btn-dark" onclick="openReinvestModal()" style="width: 100%; flex-direction: column; font-size: 0.75rem; height: 65px;">
                        <i class="fa-solid fa-rotate" style="color: var(--accent-blue);"></i> Reinvertir
                    </button>
                </div>
                <button class="btn-action btn-dark" style="flex-direction: column; font-size: 0.75rem; height: 65px;">
                    <i class="fa-solid fa-wallet"></i> Retirar
                </button>
            </div>
        </div>

        <div class="main-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div class="balance-label">Minería en curso</div>
                    <div style="font-size: 1.6rem; font-weight: 800;">$<span id="mining-balance">0.0000</span></div>
                    <div id="mining-speed" style="font-size: 0.7rem; color: var(--accent-blue);">0.0 GH/s activos</div>
                </div>
                <button onclick="claimMining()" class="btn-action btn-blue" style="padding: 10px 15px; font-size: 0.8rem;">Reclamar</button>
            </div>
        </div>
    </section>
    <section id="planes" class="view">
        <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 20px;">Purchase Hash Power</h2>
        <div class="main-card" style="display: flex; flex-direction: column; align-items: center;">
            <div class="balance-label" style="margin-bottom: 15px;">Mínimo: <span style="color: var(--accent-blue);">1.00 USDT</span></div>
            <div style="width: 100%; display: flex; align-items: center; border-bottom: 2px solid var(--accent-blue); margin-bottom: 25px;">
                <input type="number" id="invest-amount" placeholder="0.00" oninput="calculateROI()" 
                       style="font-size: 2.2rem; font-weight: 800; background: transparent; border: none; color: #fff; width: 100%; outline: none;">
                <span style="font-weight: 700; color: var(--text-dim);">USDT</span>
            </div>
            <button class="btn-action btn-blue" style="width: 100%; height: 62px; border-radius: 20px;" onclick="openPayModal()">
                ACTIVAR NODO
            </button>
        </div>
    </section>

    <section id="red" class="view">
        <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 20px;">Mi Red</h2>
        <div class="main-card" style="text-align: center;">
            <div class="balance-val" style="justify-content: center;" id="ref-count">0</div>
            <div class="balance-label">Afiliados Activos</div>
        </div>
        <div class="main-card">
            <input type="text" id="ref-link" readonly value="..." style="width: 100%; background: #0d111c; border: 1px solid var(--glass-border); padding: 15px; border-radius: 12px; color: var(--text-dim); margin-bottom: 15px;">
            <button class="btn-action btn-blue" style="width: 100%;" onclick="copyLink()">Copiar Invitación</button>
        </div>
    </section>

    <section id="history" class="view">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
            <i class="fa-solid fa-arrow-left" onclick="switchTab('dashboard')"></i>
            <h2 style="font-size: 1.5rem; font-weight: 800; margin: 0;">Historial</h2>
        </div>
        <div id="logs-container" style="text-align: center; color: var(--text-dim); margin-top: 50px;">
            <i class="fa-solid fa-box-open" style="font-size: 3rem; opacity: 0.2;"></i>
            <p>No hay transacciones</p>
        </div>
    </section>
</div>

<nav class="nav-bar">
    <div class="nav-btn active" onclick="switchTab('dashboard')">
        <i class="fa-solid fa-house-chimney"></i><span>Home</span>
    </div>
    <div class="nav-btn" onclick="switchTab('planes')">
        <i class="fa-solid fa-bolt-lightning"></i><span>Planes</span>
    </div>
    <div class="nav-btn" onclick="switchTab('red')">
        <i class="fa-solid fa-users-viewfinder"></i><span>Red</span>
    </div>
</nav>

<div id="payModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; justify-content: center; align-items: center; flex-direction: column; padding: 20px;">
    <div class="main-card" style="width: 100%; max-width: 350px; text-align: center;">
        <button onclick="document.getElementById('payModal').style.display='none'" style="position: absolute; right: 15px; top: 15px; background: none; border: none; color: white; font-size: 1.5rem;">&times;</button>
        <h3 style="margin-bottom: 5px;">Finalizar Depósito</h3>
        <div id="payment-countdown" style="color: var(--accent-blue); margin-bottom: 20px;">00:30:00</div>
        <img id="qr-image" src="" style="width: 150px; background: white; padding: 10px; border-radius: 10px; margin-bottom: 20px;">
        <div id="pay-amount-display" style="font-size: 1.5rem; font-weight: 800; margin-bottom: 15px;">0.00 USDT</div>
        <div style="background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px; font-size: 0.7rem; border: 1px dashed var(--accent-blue); word-break: break-all;" id="wallet-address-display">Generando...</div>
        <button class="btn-action btn-blue" style="width: 100%; margin-top: 15px;" onclick="copyAddress()">Copiar Dirección</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    function switchTab(tabId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }

    function openReinvestModal() {
        if (typeof window.reinvestBalance === 'function') {
            window.reinvestBalance();
        }
    }

    function openPayModal() {
        if (typeof window.openPayModal === 'function') {
            window.openPayModal();
        }
    }

    window.onload = () => {
        if (typeof initUser === 'function') initUser();
    };
</script>

<script src="js/payment.js"></script> 
<script src="js/test.js"></script>    
<script src="js/calculator.js"></script>
<script src="js/state.js" type="module"></script>
<script src="js/main.js" type="module"></script>

</body>
                    </html>
